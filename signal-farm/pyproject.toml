[project]
name = "signal-farm"
version = "0.1.0"
description = "Novelty and idea-frequency farming on a Postgres property graph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.2.9",
  "pydantic>=2.11.0",
  "pyyaml>=6.0.2",
  "rich>=14.0.0",
  "sqlmodel>=0.0.24",
  "typer>=0.16.0",
]

[project.scripts]
signal-farm = "signal_farm.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
